<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>NoteGuide Gestionale</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%236250d6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="stile.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="testata">
    <div class="marchio">NoteGuide <span>Gestionale</span></div>
    <div id="stato-dati" class="pillola" role="status"></div>
  </header>
  <nav id="schede" class="schede" aria-label="Sezioni"></nav>
  <main id="contenuto" tabindex="-1"></main>

  <section id="accesso" class="accesso" hidden>
    <h1>Accesso</h1>
    <p>Scrivi la tua email: ti arriva un link per entrare. Funziona solo per Ettore e Matteo.</p>
    <form id="modulo-accesso">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <button type="submit">Mandami il link</button>
    </form>
    <p id="esito-accesso" role="status"></p>
  </section>
</body>
</html>
